<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" role="img" aria-label="16 - Operadores - Ejercicio 4 - Área y longitud de un círculo"><defs><style>svg{background:#000;font-family:Arial,Helvetica,sans-serif}.arrow{fill:none;stroke:#ddd;stroke-width:1.5;marker-end:url(#arr)}.terminal{fill:#703078;stroke:#d58bdb;stroke-width:1.3}.in{fill:#0754a6;stroke:#00a6ff;stroke-width:1.5}.out{fill:#008b19;stroke:#00ff31;stroke-width:1.5}.assign{fill:#a87800;stroke:#ffdc55;stroke-width:1.5}.label{fill:#fff;font-size:14px;text-anchor:middle;dominant-baseline:middle}</style><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#ddd"/></marker></defs><rect class="terminal" x="450" y="20" width="100" height="30" rx="15"/><text class="label" x="500" y="35">Main</text><path class="arrow" d="M500 50 V115"/><rect class="assign" x="330" y="115" width="310" height="55" rx="2"/><text class="label" x="485" y="143">Importar pi desde math</text><path class="arrow" d="M492 170 V220"/><polygon class="in" points="345,220 655,220 640,275 330,275"/><text class="label" x="492" y="248">radio = float(input(...))</text><path class="arrow" d="M492 275 V325"/><rect class="assign" x="330" y="325" width="310" height="55" rx="2"/><text class="label" x="485" y="353">area = pi × radio²</text><path class="arrow" d="M492 380 V430"/><rect class="assign" x="330" y="430" width="310" height="55" rx="2"/><text class="label" x="485" y="458">longitud = 2 × pi × radio</text><path class="arrow" d="M492 485 V535"/><polygon class="out" points="345,535 655,535 640,590 330,590"/><text class="label" x="492" y="563">Mostrar área</text><path class="arrow" d="M492 590 V640"/><polygon class="out" points="345,640 655,640 640,695 330,695"/><text class="label" x="492" y="668">Mostrar longitud</text><path class="arrow" d="M492 695 V770"/><rect class="terminal" x="450" y="770" width="100" height="30" rx="15"/><text class="label" x="500" y="785">End</text></svg>