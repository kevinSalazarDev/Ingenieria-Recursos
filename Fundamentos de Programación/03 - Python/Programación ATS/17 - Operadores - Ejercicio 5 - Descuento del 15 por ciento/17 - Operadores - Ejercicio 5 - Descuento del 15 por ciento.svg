<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 658"><defs><style>svg{background:#0a0c10}.title{font:bold 22px Arial;fill:#f3f4f6}.label{font:16px Arial;fill:#e5e7eb}.process{fill:#1f2937;stroke:#81b1db;stroke-width:2}.terminal{fill:#173b32;stroke:#65c99a;stroke-width:2}.arrow{stroke:#cbd5e1;stroke-width:2;fill:none}</style></defs><text x="380" y="48" text-anchor="middle" class="title">17 - Operadores - Ejercicio 5 - Descuento del 15 por ciento</text><rect x="305" y="100" width="150" height="58" rx="28" class="terminal"/><text x="380" y="135" text-anchor="middle" class="label">Inicio</text><path d="M380 158 V183 m-7 -8 l7 8 7 -8" class="arrow"/><rect x="130" y="188" width="500" height="58" rx="10" class="process"/><text x="380" y="223" text-anchor="middle" class="label">Leer el total de la compra</text><path d="M380 246 V271 m-7 -8 l7 8 7 -8" class="arrow"/><rect x="130" y="276" width="500" height="58" rx="10" class="process"/><text x="380" y="311" text-anchor="middle" class="label">Calcular descuento = total × 15 / 100</text><path d="M380 334 V359 m-7 -8 l7 8 7 -8" class="arrow"/><rect x="130" y="364" width="500" height="58" rx="10" class="process"/><text x="380" y="399" text-anchor="middle" class="label">Calcular total a pagar = total − descuento</text><path d="M380 422 V447 m-7 -8 l7 8 7 -8" class="arrow"/><rect x="130" y="452" width="500" height="58" rx="10" class="process"/><text x="380" y="487" text-anchor="middle" class="label">Mostrar total a pagar</text><path d="M380 510 V535 m-7 -8 l7 8 7 -8" class="arrow"/><rect x="305" y="540" width="150" height="58" rx="28" class="terminal"/><text x="380" y="575" text-anchor="middle" class="label">Fin</text></svg>