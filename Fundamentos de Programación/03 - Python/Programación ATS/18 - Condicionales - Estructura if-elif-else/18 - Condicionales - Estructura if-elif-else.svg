<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-label="Diagrama de flujo estilo Flowgorithm: condicional if-elif-else">
<defs>
  <style>
    svg{background:#fff;font-family:Arial,Helvetica,sans-serif}
    .title{font-size:24px;font-weight:700;fill:#222}
    .terminal{fill:#d9eaf7;stroke:#333;stroke-width:2}
    .input{fill:#9fc5e8;stroke:#333;stroke-width:2}
    .output{fill:#b6d7a8;stroke:#333;stroke-width:2}
    .decision{fill:#ead1dc;stroke:#333;stroke-width:2}
    .label{font-size:18px;fill:#222;text-anchor:middle;dominant-baseline:middle}
    .branch{font-size:16px;font-weight:700;fill:#222}
    .flow{fill:none;stroke:#333;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0 0 L0 6 L9 3 Z" fill="#333"/>
  </marker>
</defs>
<text class="title" x="600" y="32" text-anchor="middle">18 - Condicionales - Estructura if-elif-else</text>

<!-- Main -->
<rect class="terminal" x="525" y="60" width="150" height="54" rx="27"/>
<text class="label" x="600" y="87">Main</text>
<path class="flow" d="M600 114 V165"/>

<!-- Input -->
<polygon class="input" points="455,165 745,165 725,235 435,235"/>
<text class="label" x="590" y="200">numero = Leer número</text>
<path class="flow" d="M590 235 V285"/>

<!-- If numero > 0 -->
<polygon class="decision" points="590,285 735,365 590,445 445,365"/>
<text class="label" x="590" y="365">numero &gt; 0</text>

<!-- True: positive -->
<path class="flow" d="M445 365 H225 V500"/>
<text class="branch" x="320" y="347">Verdadero</text>
<polygon class="output" points="105,500 355,500 335,575 85,575"/>
<text class="label" x="220" y="538">Mostrar positivo</text>

<!-- False: second condition -->
<path class="flow" d="M735 365 H900 V500"/>
<text class="branch" x="790" y="347">Falso</text>
<polygon class="decision" points="900,500 1045,580 900,660 755,580"/>
<text class="label" x="900" y="580">numero == 0</text>

<!-- True: zero -->
<path class="flow" d="M755 580 H650 V735"/>
<text class="branch" x="675" y="562">Verdadero</text>
<polygon class="output" points="535,735 785,735 765,810 515,810"/>
<text class="label" x="650" y="773">Mostrar cero</text>

<!-- False: negative -->
<path class="flow" d="M1045 580 H1080 V735"/>
<text class="branch" x="1050" y="560">Falso</text>
<polygon class="output" points="955,735 1185,735 1165,810 935,810"/>
<text class="label" x="1060" y="773">Mostrar negativo</text>

<!-- Join branches and End -->
<path class="flow" d="M220 575 V925 H600 V1000"/>
<path class="flow" d="M650 810 V1000"/>
<path class="flow" d="M1060 810 V925 H600"/>
<rect class="terminal" x="525" y="1000" width="150" height="54" rx="27"/>
<text class="label" x="600" y="1027">End</text>
</svg>