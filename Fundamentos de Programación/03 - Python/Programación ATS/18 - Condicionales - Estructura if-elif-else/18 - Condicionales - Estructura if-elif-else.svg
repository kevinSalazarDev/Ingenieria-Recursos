<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-label="Diagrama de flujo del ejercicio 18: condicionales if, elif y else">
<defs>
<style>
svg{background:#000;font-family:Arial,Helvetica,sans-serif}
.line{fill:none;stroke:#d8d8d8;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:round}
.arrow{fill:none;stroke:#d8d8d8;stroke-width:1.5;marker-end:url(#arrow)}
.terminal{fill:#703078;stroke:#d58bdb;stroke-width:1.3}
.input{fill:#0754a6;stroke:#00a6ff;stroke-width:1.5}
.output{fill:#008b19;stroke:#00ff31;stroke-width:1.5}
.decision{fill:#813f48;stroke:#ed9ca5;stroke-width:1.3}
.label{fill:#fff;font-size:14px;text-anchor:middle;dominant-baseline:middle}
.branch{fill:#fff;font-size:12px}
.connector{fill:#b66c72;stroke:#f0b4b8;stroke-width:1.2}
</style>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
<path d="M0 0 L6 3 L0 6" fill="none" stroke="#d8d8d8" stroke-width="1"/>
</marker>
</defs>

<!-- Inicio y lectura -->
<rect class="terminal" x="550" y="25" width="100" height="30" rx="15"/>
<text class="label" x="600" y="40">Main</text>
<path class="arrow" d="M600 55 V105"/>
<polygon class="input" points="535,105 665,105 652,150 522,150"/>
<text class="label" x="593" y="128">Input numero</text>
<path class="arrow" d="M593 150 V205"/>

<!-- Primer If -->
<polygon class="decision" points="593,205 690,260 593,315 496,260"/>
<text class="label" x="593" y="260">numero &gt; 0</text>

<!-- Verdadero: positivo -->
<path class="arrow" d="M496 260 H180 V420"/>
<text class="branch" x="340" y="247">Verdadero</text>
<polygon class="output" points="65,420 295,420 280,480 50,480"/>
<text class="label" x="173" y="450">Output: número positivo</text>

<!-- Falso: evaluar segunda condición -->
<path class="arrow" d="M690 260 H930 V405"/>
<text class="branch" x="760" y="247">Falso</text>
<polygon class="decision" points="930,405 1027,460 930,515 833,460"/>
<text class="label" x="930" y="460">numero == 0</text>

<!-- Verdadero: cero -->
<path class="arrow" d="M833 460 H600 V625"/>
<text class="branch" x="700" y="447">Verdadero</text>
<polygon class="output" points="485,625 715,625 700,685 470,685"/>
<text class="label" x="593" y="655">Output: número cero</text>

<!-- Falso: negativo -->
<path class="arrow" d="M1027 460 H1040 V625"/>
<text class="branch" x="1040" y="447">Falso</text>
<polygon class="output" points="925,625 1155,625 1140,685 910,685"/>
<text class="label" x="1033" y="655">Output: número negativo</text>

<!-- Unión de las tres salidas -->
<path class="line" d="M173 480 V830 H600"/>
<path class="line" d="M593 685 V830"/>
<path class="line" d="M1033 685 V830 H600"/>
<circle class="connector" cx="173" cy="830" r="5"/>
<circle class="connector" cx="600" cy="830" r="5"/>
<circle class="connector" cx="1033" cy="830" r="5"/>
<path class="arrow" d="M600 830 V910"/>
<rect class="terminal" x="550" y="910" width="100" height="30" rx="15"/>
<text class="label" x="600" y="925">End</text>
</svg>