<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-label="Diagrama de flujo del ejercicio 18 con ramas Verdadero a la derecha y Falso a la izquierda">
<defs>
<style>
svg{background:#000;font-family:Arial,Helvetica,sans-serif}
.line{fill:none;stroke:#d8d8d8;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:round}
.arrow{fill:none;stroke:#d8d8d8;stroke-width:1.5;marker-end:url(#arrow)}
.terminal{fill:#703078;stroke:#d58bdb;stroke-width:1.3}
.input{fill:#0754a6;stroke:#00a6ff;stroke-width:1.5}
.output{fill:#008b19;stroke:#00ff31;stroke-width:1.5}
.decision{fill:#813f48;stroke:#ed9ca5;stroke-width:1.3}
.label{fill:#fff;font-size:13px;text-anchor:middle;dominant-baseline:middle}
.branch{fill:#fff;font-size:12px}
.connector{fill:#b66c72;stroke:#f0b4b8;stroke-width:1.2}
</style>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
<path d="M0 0 L6 3 L0 6" fill="none" stroke="#d8d8d8" stroke-width="1"/>
</marker>
</defs>

<!-- Main y lectura -->
<rect class="terminal" x="450" y="20" width="100" height="30" rx="15"/>
<text class="label" x="500" y="35">Main</text>
<path class="arrow" d="M500 50 V95"/>
<polygon class="input" points="435,95 565,95 552,140 422,140"/>
<text class="label" x="493" y="118">Input numero</text>
<path class="arrow" d="M493 140 V190"/>

<!-- If numero > 0: True a la derecha, False a la izquierda -->
<polygon class="decision" points="500,190 600,245 500,300 400,245"/>
<text class="label" x="500" y="245">numero &gt; 0</text>

<!-- True: positivo, derecha -->
<path class="arrow" d="M600 245 H805 V405"/>
<text class="branch" x="680" y="232">Verdadero</text>
<polygon class="output" points="700,405 930,405 915,465 685,465"/>
<text class="label" x="808" y="435">Output: número positivo</text>

<!-- False: continuar con elif, izquierda -->
<path class="arrow" d="M400 245 H250 V390"/>
<text class="branch" x="300" y="232">Falso</text>
<polygon class="decision" points="250,390 350,445 250,500 150,445"/>
<text class="label" x="250" y="445">numero == 0</text>

<!-- Segundo If: True a la derecha -->
<path class="arrow" d="M350 445 H535 V570"/>
<text class="branch" x="405" y="432">Verdadero</text>
<polygon class="output" points="430,570 660,570 645,630 415,630"/>
<text class="label" x="538" y="600">Output: número cero</text>

<!-- Segundo If: False a la izquierda -->
<path class="arrow" d="M150 445 H110 V570"/>
<text class="branch" x="115" y="432">Falso</text>
<polygon class="output" points="15,570 245,570 230,630 0,630"/>
<text class="label" x="122" y="600">Output: número negativo</text>

<!-- Unión de las tres alternativas -->
<path class="line" d="M808 465 V735 H500"/>
<path class="line" d="M538 630 V735"/>
<path class="line" d="M122 630 V735 H500"/>
<circle class="connector" cx="808" cy="735" r="5"/>
<circle class="connector" cx="538" cy="735" r="5"/>
<circle class="connector" cx="122" cy="735" r="5"/>
<path class="arrow" d="M500 735 V815"/>
<rect class="terminal" x="450" y="815" width="100" height="30" rx="15"/>
<text class="label" x="500" y="830">End</text>
</svg>