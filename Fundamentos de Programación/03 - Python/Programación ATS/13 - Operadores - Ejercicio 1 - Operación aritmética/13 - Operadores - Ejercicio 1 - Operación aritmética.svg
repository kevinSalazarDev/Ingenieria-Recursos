<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="Diagrama de flujo del ejercicio 13: operación aritmética">
<defs>
<style>
svg{background:#000;font-family:Arial,Helvetica,sans-serif}
.line{fill:none;stroke:#ddd;stroke-width:1.6;marker-end:url(#arrow)}
.terminal{fill:#703078;stroke:#d58bdb;stroke-width:1.5}
.input{fill:#0754a6;stroke:#00a6ff;stroke-width:1.5}
.assign{fill:#a87800;stroke:#ffdc55;stroke-width:1.5}
.output{fill:#008b19;stroke:#00ff31;stroke-width:1.5}
.label{fill:#fff;font-size:15px;text-anchor:middle;dominant-baseline:middle}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#ddd" stroke-width="1"/></marker>
</defs>
<rect width="1000" height="760" fill="#000"/>
<rect class="terminal" x="450" y="22" width="100" height="34" rx="17"/>
<text class="label" x="500" y="39">Main</text>
<path class="line" d="M500 56 V105"/>
<polygon class="input" points="345,105 655,105 640,160 330,160"/>
<text class="label" x="492" y="132">a = float(input(...))</text>
<path class="line" d="M492 160 V205"/>
<polygon class="input" points="345,205 655,205 640,260 330,260"/>
<text class="label" x="492" y="232">b = float(input(...))</text>
<path class="line" d="M492 260 V305"/>
<polygon class="input" points="345,305 655,305 640,360 330,360"/>
<text class="label" x="492" y="332">c = float(input(...))</text>
<path class="line" d="M492 360 V410"/>
<rect class="assign" x="280" y="410" width="430" height="66" rx="3"/>
<text class="label" x="495" y="443">resultado = (a³ × (b² − 2ac)) / (2b)</text>
<path class="line" d="M495 476 V530"/>
<polygon class="output" points="345,530 655,530 640,585 330,585"/>
<text class="label" x="492" y="557">Mostrar resultado</text>
<path class="line" d="M492 585 V700"/>
<rect class="terminal" x="450" y="700" width="100" height="34" rx="17"/>
<text class="label" x="500" y="717">End</text>
</svg>