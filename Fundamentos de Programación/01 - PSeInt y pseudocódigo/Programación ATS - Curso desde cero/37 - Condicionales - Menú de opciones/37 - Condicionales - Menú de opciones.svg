<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#fff"/><text x="600" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#202938">37 - Condicionales - Menú de opciones</text><rect x="260" y="88" width="680" height="54" rx="26" fill="#e8f2ff" stroke="#65758b" stroke-width="2"/><text x="600" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Inicio</text><path d="M600 142 V158" stroke="#46576c" stroke-width="2"/><rect x="260" y="162" width="680" height="54" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="600" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Mostrar menú y leer opcion</text><path d="M600 216 V232" stroke="#46576c" stroke-width="2"/><polygon points="600,248 795,292 600,336 405,292" fill="#fff4db" stroke="#a87920" stroke-width="2"/><text x="600" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">¿Qué opción se eligió?</text><path d="M600 336 V373 H286 V408" fill="none" stroke="#46576c" stroke-width="2"/><rect x="136" y="408" width="300" height="118" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="286" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#202938">1: leer número y potencia; calcular num^potencia</text><path d="M600 336 V373 H600 V408" fill="none" stroke="#46576c" stroke-width="2"/><rect x="450" y="408" width="300" height="118" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="600" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#202938">2: leer número; calcular raíz cuadrada</text><path d="M600 336 V373 H914 V408" fill="none" stroke="#46576c" stroke-width="2"/><rect x="764" y="408" width="300" height="118" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="914" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#202938">3 u otra: terminar (el código no define una acción para la opción 3)</text><text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202938">Fin del proceso</text></svg>