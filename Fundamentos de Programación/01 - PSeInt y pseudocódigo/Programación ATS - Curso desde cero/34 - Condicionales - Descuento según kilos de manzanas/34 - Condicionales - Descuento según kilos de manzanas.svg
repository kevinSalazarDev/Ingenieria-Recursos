<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="#fff"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202938">34 - Condicionales - Descuento según kilos de manzanas</text><rect x="275" y="90" width="650" height="54" rx="25" fill="#e8f2ff" stroke="#65758b" stroke-width="2"/><text x="600" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Inicio</text><path d="M600 144 V161" stroke="#46576c" stroke-width="2"/><rect x="275" y="166" width="650" height="54" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="600" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Leer precio por kilo y kilos comprados</text><path d="M600 220 V237" stroke="#46576c" stroke-width="2"/><rect x="275" y="242" width="650" height="54" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="600" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Calcular precio_kilos = precio × kilos</text><path d="M600 296 V313" stroke="#46576c" stroke-width="2"/><polygon points="600,336 780,382 600,428 420,382" fill="#fff4db" stroke="#a87920" stroke-width="2"/><text x="600" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">¿En qué rango están los kilos?</text><path d="M600 428 V461 H201 V506" fill="none" stroke="#46576c" stroke-width="2"/><rect x="76" y="506" width="250" height="105" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="201" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202938">Hasta 2 kg: 0 % de descuento</text><path d="M600 428 V461 H467 V506" fill="none" stroke="#46576c" stroke-width="2"/><rect x="342" y="506" width="250" height="105" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="467" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202938">Más de 2 y hasta 5 kg: 10 %</text><path d="M600 428 V461 H733 V506" fill="none" stroke="#46576c" stroke-width="2"/><rect x="608" y="506" width="250" height="105" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="733" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202938">Más de 5 y hasta 10 kg: 15 %</text><path d="M600 428 V461 H999 V506" fill="none" stroke="#46576c" stroke-width="2"/><rect x="874" y="506" width="250" height="105" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="999" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202938">Más de 10 kg: 20 %</text><text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202938">Fin del proceso</text></svg>