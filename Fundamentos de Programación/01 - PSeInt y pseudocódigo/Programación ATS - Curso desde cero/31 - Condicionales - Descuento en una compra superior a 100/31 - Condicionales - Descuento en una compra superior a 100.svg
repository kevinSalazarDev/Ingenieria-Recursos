<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="#fff"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202938">31 - Condicionales - Descuento en una compra superior a 100</text><rect x="275" y="90" width="650" height="54" rx="25" fill="#e8f2ff" stroke="#65758b" stroke-width="2"/><text x="600" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Inicio</text><path d="M600 144 V161" stroke="#46576c" stroke-width="2"/><rect x="275" y="166" width="650" height="54" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="600" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">Leer el precio de la compra</text><path d="M600 220 V237" stroke="#46576c" stroke-width="2"/><polygon points="600,260 780,306 600,352 420,306" fill="#fff4db" stroke="#a87920" stroke-width="2"/><text x="600" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#202938">¿precio &gt; 100?</text><path d="M600 352 V385 H467 V430" fill="none" stroke="#46576c" stroke-width="2"/><rect x="342" y="430" width="250" height="105" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="467" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202938">Sí: aplicar 20 % de descuento y mostrar total</text><path d="M600 352 V385 H733 V430" fill="none" stroke="#46576c" stroke-width="2"/><rect x="608" y="430" width="250" height="105" rx="8" fill="#f4f6f8" stroke="#65758b" stroke-width="2"/><text x="733" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#202938">No: informar que no alcanza el mínimo</text><text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#202938">Fin del proceso</text></svg>